# Start services
systemctl start httpd php-fpm
systemctl enable httpd php-fpm

# Pull backup from S3 and extract to web root
mkdir -p /tmp/restore
aws s3 cp s3://swe40006-portfolio2-lambucket-247011205721-us-east-1-an/instance-backup/wordpress_app_backup.tar.gz /tmp/restore/
tar -xzvf /tmp/restore/wordpress_app_backup.tar.gz -C /var/www/html/

# Ensure permissions
chown -R apache:apache /var/www/html/WordPress
chmod -R 755 /var/www/html/WordPress






